    </div>

    <script src="utils/fetch-module.js"></script>
    <script>
      // config
      const INFO_BOX = document.querySelector(".info-box");
      const LOADING_BOX = document.querySelector(".loading");
      const COLECTIONS_CONTAINER = document.querySelector(".colections");
      const POPUP = document.querySelector("#popup");

      let galleries = [];

      function show_popup(index) {
        document.querySelector("#popup .image").style.backgroundImage = `url('${galleries[index].image_url}')`;
        document.querySelector("#popup .title").textContent = galleries[index].title;
        document.querySelector("#popup .description").textContent = galleries[index].description;
        POPUP.classList.toggle("hide", false);
        POPUP.querySelector("#popup .open").setAttribute("href", galleries[index].page_url);
      }

      function hide_popup() {
        POPUP.classList.toggle("hide", true);
      }

      function set_loading(force = true) {
        LOADING_BOX.classList.toggle("hide", !force);
      }

      function set_info(msg, is_err) {
        INFO_BOX.querySelector("p").textContent = msg;
        INFO_BOX.classList.toggle("hide", false);
        INFO_BOX.classList.toggle("error", is_err);
      }

      async function load_galleries() {
        const API_POINT = BACKEND_URL + "/galleries";
        const res = await get_fetch(API_POINT, { method: "GET" });

        if (!res.success) {
          set_info(res.message, true);
          return;
        }

        const data = await res.res.json();
        galleries = data.data;
        return galleries;
      }

      // display_submission();
      async function display_galleries() {
        set_loading();

        const galleries = await load_galleries();

        COLECTIONS_CONTAINER.innerHTML = "";
        galleries.forEach((val, i) => {
          COLECTIONS_CONTAINER.innerHTML += `  <div class="colection-item">
          <div class="image" style="background-image: url('${val.image_url}')" onclick="show_popup(${i})"></div>
          <div class="info">
            <p>${val.title}</p>
            <a href="${val.page_url}">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link-icon lucide-external-link"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            </a>
          </div>
        </div>`;
        });

        set_loading(false);
      }

      document.addEventListener("DOMContentLoaded", display_galleries);
    </script>
